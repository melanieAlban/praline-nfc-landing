<div id="page" class="page">
<div class="column" id="top">

  <!-- ============ BARRA SUPERIOR (fija) ============ -->
  <header class="topbar" id="topbar">
    <a class="topbar-brand" href="#top" data-t-aria="home">
      <img src="assets/logo-dark.webp" alt="Praliné Coffee House" width="140" height="45">
    </a>
    <nav class="topbar-actions" data-t-aria="nav">
      <button type="button" class="topbar-cta" id="bar-menu" aria-haspopup="dialog">
        <svg class="ic ic-sm" aria-hidden="true"><use href="#i-menu"/></svg>
        <span data-t="menuShort"></span>
      </button>
      <div class="lang" role="group" data-t-aria="lang">
        <button type="button" id="btn-es" lang="es" aria-label="Español">ES</button>
        <button type="button" id="btn-en" lang="en" aria-label="English">EN</button>
      </div>
    </nav>
  </header>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-pattern" aria-hidden="true"></div>
      <div class="hero-inner reveal">
        <p class="status" id="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span class="status-label" id="status-label"></span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-note" id="status-note"></span>
        </p>
        <h1 id="hero-title" class="hero-logo">
          <img src="assets/logo-light.webp" alt="Praliné Coffee House" width="248" height="79" fetchpriority="high">
        </h1>
        <p class="hero-tagline"><span data-t="heroA"></span><br><span data-t="heroB"></span></p>
      </div>
    </section>

    <!-- arco rosa → blanco, con el filete de la portada del menú impreso -->
    <div class="arch" aria-hidden="true"><span></span></div>

    <!-- ============ 1. EN LA MESA ============ -->
    <section class="block block-first reveal" style="--d:.06s" data-t-aria="tableSection">
      <button type="button" id="menu-open" class="cta" aria-haspopup="dialog">
        <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
        <span class="row-text">
          <span class="cta-title" data-t="menu"></span>
          <span class="cta-sub" data-t="menuSub"></span>
        </span>
        <svg class="ic ic-xs row-trail" aria-hidden="true"><use href="#i-caret"/></svg>
      </button>

      <div class="card wifi">
        <div class="wifi-head">
          <svg class="ic" aria-hidden="true"><use href="#i-wifi"/></svg>
          <h2 class="label" data-t="wifi"></h2>
        </div>
        <dl class="wifi-data">
          <dt class="label label-sm" data-t="ssid"></dt>
          <dd data-cfg="wifiSsid"></dd>
          <dt class="label label-sm" data-t="pass"></dt>
          <dd class="wifi-pass" data-cfg="wifiPass"></dd>
        </dl>
        <button type="button" id="copy-btn" class="btn-outline">
          <svg class="ic ic-sm" aria-hidden="true"><use id="copy-icon" href="#i-copy"/></svg>
          <span id="copy-text"></span>
        </button>
        <span class="sr-only" id="copy-live" aria-live="polite"></span>
      </div>
    </section>

    <div class="ornament" aria-hidden="true"><svg class="ic ic-xs"><use href="#i-bean"/></svg></div>

    <!-- ============ 2. ANTES DE IRTE ============ -->
    <section class="block reveal" style="--d:.12s" aria-labelledby="rev-title">
      <h2 class="section-title" id="rev-title"><span data-t="revTitle"></span></h2>
      <div class="card review">
        <p class="review-head" data-t="revHead"></p>
        <p class="review-body" data-t="revBody"></p>
        <a class="btn-solid" data-link="review" target="_blank" rel="noopener noreferrer">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#i-star"/></svg>
          <span data-t="revCta"></span>
        </a>
        <p class="review-note" data-t="revCtaSub"></p>
      </div>
    </section>

    <section class="block reveal" style="--d:.16s" aria-labelledby="social-title">
      <h2 class="section-title" id="social-title"><span data-t="social"></span></h2>
      <ul class="list">
        <li><a class="row" data-link="instagram" target="_blank" rel="noopener noreferrer">
          <svg class="ic" aria-hidden="true"><use href="#i-instagram"/></svg>
          <span class="row-text"><span class="row-title">Instagram</span><span class="row-sub" data-cfg="instagramHandle"></span></span>
          <svg class="ic ic-xs row-trail" aria-hidden="true"><use href="#i-out"/></svg>
        </a></li>
        <li><a class="row" data-link="facebook" target="_blank" rel="noopener noreferrer">
          <svg class="ic" aria-hidden="true"><use href="#i-facebook"/></svg>
          <span class="row-text"><span class="row-title">Facebook</span><span class="row-sub">Praliné Coffee House</span></span>
          <svg class="ic ic-xs row-trail" aria-hidden="true"><use href="#i-out"/></svg>
        </a></li>
      </ul>
    </section>

    <div class="ornament" aria-hidden="true"><svg class="ic ic-xs"><use href="#i-bean"/></svg></div>

    <!-- ============ 3. PARA VOLVER ============ -->
    <section class="block reveal" style="--d:.2s" aria-labelledby="hours-title">
      <h2 class="section-title" id="hours-title"><span data-t="hoursTitle"></span></h2>
      <!-- filas generadas desde HOURS en script.js -->
      <ul class="hours" id="hours"></ul>

      <ul class="list list-spaced">
        <li><a class="row" data-link="whatsapp" target="_blank" rel="noopener noreferrer">
          <svg class="ic" aria-hidden="true"><use href="#i-whatsapp"/></svg>
          <span class="row-text"><span class="row-title">WhatsApp</span><span class="row-sub" data-t="waSub"></span></span>
          <svg class="ic ic-xs row-trail" aria-hidden="true"><use href="#i-out"/></svg>
        </a></li>
        <li><a class="row" data-link="maps" target="_blank" rel="noopener noreferrer">
          <svg class="ic" aria-hidden="true"><use href="#i-pin"/></svg>
          <span class="row-text"><span class="row-title" data-t="way"></span><span class="row-sub"><span data-cfg="address"></span><br><em data-t="addrNote"></em></span></span>
          <svg class="ic ic-xs row-trail" aria-hidden="true"><use href="#i-out"/></svg>
        </a></li>
      </ul>
    </section>
  </main>

  <!-- ============ PIE ============ -->
  <footer class="footer reveal" style="--d:.28s">
    <div class="footer-pattern" aria-hidden="true"></div>
    <div class="footer-inner">
      <div class="mascots" aria-hidden="true">
        <img src="assets/mascota-lazo.webp" alt="" width="60" height="63" loading="lazy">
        <img src="assets/mascota-sombrero.webp" alt="" width="60" height="59" loading="lazy">
      </div>
      <p class="slogan"><span data-t="sloganA"></span><br><span data-t="sloganB"></span></p>
      <a class="footer-link" data-link="instagram" data-cfg="instagramHandle" target="_blank" rel="noopener noreferrer"></a>
      <span class="footer-place">Baños de Agua Santa · Ecuador</span>
    </div>
  </footer>

</div>
</div>

<!-- ============ VISOR DE MENÚ (hoja inferior) ============ -->
<div id="menu-sheet" class="sheet" hidden>
  <div id="menu-backdrop" class="sheet-backdrop"></div>
  <div id="menu-panel" class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div id="menu-head" class="sheet-head">
      <div class="sheet-pattern" aria-hidden="true"></div>
      <div class="sheet-grip" aria-hidden="true"><span></span></div>
      <div class="sheet-titlebar">
        <h2 id="menu-title" data-t="menuTitle"></h2>
        <button type="button" id="menu-close" class="icon-btn">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <nav id="menu-chips" class="chips"></nav>
    </div>
    <div id="menu-body" class="sheet-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
