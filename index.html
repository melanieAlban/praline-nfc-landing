<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A27572">
<title>Praliné Coffee House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="page" style="min-height:100%;background:#FFFFFF;display:flex;justify-content:center">
<div style="width:100%;max-width:480px;position:relative;background:
    radial-gradient(circle at 18% 22%, rgba(90,58,46,.05) 0 1px, transparent 1.6px),
    radial-gradient(circle at 62% 71%, rgba(20,20,20,.035) 0 1px, transparent 1.6px),
    radial-gradient(circle at 88% 41%, rgba(90,58,46,.045) 0 1px, transparent 1.6px),
    #FFFFFF;background-size:37px 37px,53px 53px,71px 71px;overflow:hidden">

  <!-- textura de papel: ruido generado en el propio archivo (SVG inline como data-URI, sin imágenes externas) -->
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.4;mix-blend-mode:multiply;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/><feColorMatrix type=%22saturate%22 values=%220%22/></filter><rect width=%22160%22 height=%22160%22 filter=%22url(%23n)%22 opacity=%220.32%22/></svg>');background-size:160px 160px"></div>

  <!-- ============ HERO ============ -->
  <div style="position:relative;background:#A27572;padding:62px 28px 96px;overflow:hidden">
    <div aria-hidden="true" style="position:absolute;inset:0;opacity:.12;background-image:url('assets/praline-botanical-white.png');background-size:280px 280px;background-repeat:repeat"></div>

    <!-- idioma: cápsula crema para que las siglas no queden en texto chico sobre rosa -->
    <div style="position:absolute;top:8px;right:12px;z-index:2;display:flex;align-items:center">
      <button type="button" id="btn-es" lang="es" aria-label="Español" style="height:48px;width:48px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:flex-end">
        <span id="pill-es" style="display:flex;align-items:center;justify-content:center;height:30px;width:40px;border-radius:999px 0 0 999px;font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em">ES</span>
      </button>
      <button type="button" id="btn-en" lang="en" aria-label="English" style="height:48px;width:48px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:flex-start">
        <span id="pill-en" style="display:flex;align-items:center;justify-content:center;height:30px;width:40px;border-radius:0 999px 999px 0;font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em">EN</span>
      </button>
    </div>

    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;animation:prFade .3s ease-out both">
      <!-- estado: chip + línea de contexto (calculados con la hora local) -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid #DCDCCA;border-radius:999px;background:#EFE3D6">
          <span id="status-dot" style="width:6px;height:6px;border-radius:50%"></span>
          <span id="status-label" style="font-family:'Jost',sans-serif;font-weight:500;font-size:10px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase;white-space:nowrap"></span>
        </div>
        <p id="status-note" style="margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:18px;line-height:1.3;color:#FFFFFF;text-align:center"></p>
      </div>

      <h1 style="margin:0;padding-top:4px;display:flex;justify-content:center">
        <img src="assets/praline-logo.png" alt="Praliné Coffee House" width="248" height="82" style="width:248px;height:auto;display:block">
      </h1>

      <p style="margin:4px 0 0;font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:19px;line-height:1.5;color:#FFFFFF;text-align:center;max-width:250px;text-wrap:pretty"><span data-t="heroA"></span><br><span data-t="heroB"></span></p>
    </div>
  </div>

  <!-- arco de transición rosa -> blanco -->
  <div style="position:relative;margin-top:-58px;height:58px;overflow:hidden">
    <div style="position:absolute;inset:0;background:#FFFFFF;border-radius:50% 50% 0 0 / 58px 58px 0 0"></div>
    <!-- filete interior del arco, como la portada del menú impreso -->
    <div aria-hidden="true" style="position:absolute;left:24px;right:24px;top:10px;height:44px;border-top:1px solid #DCDCCA;border-radius:50% 50% 0 0 / 44px 44px 0 0"></div>
  </div>

  <!-- ============ 1. EN LA MESA: menú + wifi ============ -->
  <div style="padding:0 28px;margin-top:-26px;position:relative;display:flex;flex-direction:column;gap:12px;animation:prFade .3s ease-out .06s both">
    <button type="button" id="menu-open" aria-haspopup="dialog" class="pr-btn-brand" style="width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:16px;min-height:80px;padding:16px 20px;background:#A27572;border:1px solid #A27572;border-radius:8px;transition:transform .18s ease,background .18s ease">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M4 4.5h16v15H4z"></path><path d="M12 4.5v15"></path><path d="M7 9h2M7 12h2M15 9h2M15 12h2"></path></svg>
      <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
        <span data-t="menu" style="font-family:'Jost',sans-serif;font-weight:500;font-size:18px;letter-spacing:.14em;color:#FFFFFF;text-transform:uppercase"></span>
        <span data-t="menuSub" style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:18px;line-height:1.25;color:#FFFFFF"></span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
    </button>

    <!-- Wi-Fi -->
    <div style="padding:16px 18px 18px;background:#EFE3D6;border:1px solid #DCDCCA;border-radius:8px">
      <div style="display:flex;align-items:center;gap:14px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" aria-hidden="true" style="flex:none"><path d="M3.5 9.2a13 13 0 0 1 17 0"></path><path d="M6.6 12.6a8.6 8.6 0 0 1 10.8 0"></path><path d="M9.6 16a4.4 4.4 0 0 1 4.8 0"></path><circle cx="12" cy="19.2" r=".9" fill="#565243" stroke="none"></circle></svg>
        <span data-t="wifi" style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase"></span>
      </div>
      <dl style="margin:12px 0 0;padding-left:36px;display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:16px;row-gap:6px">
        <dt data-t="ssid" style="font-family:'Jost',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase"></dt>
        <dd style="margin:0;font-family:ui-monospace,Menlo,monospace;font-size:15px;color:#5A3A2E;letter-spacing:.04em">Praline_Guest</dd>
        <dt data-t="pass" style="font-family:'Jost',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase"></dt>
        <dd style="margin:0;font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#5A3A2E;letter-spacing:.06em">praline2024</dd>
      </dl>
      <button type="button" id="copy-btn" aria-live="polite" class="pr-copy-btn" style="margin-top:14px;width:100%;height:48px;border:1px solid #5A3A2E;border-radius:8px;background:transparent;cursor:pointer;font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#5A3A2E;transition:background .2s"></button>
    </div>
  </div>

  <!-- separador: fin de "en la mesa" -->
  <div aria-hidden="true" style="display:flex;align-items:center;padding:40px 28px 0">
    <span style="flex:1;height:1px;background:#DCDCCA"></span>
    <span style="display:flex;align-items:center;justify-content:center;width:26px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A3A2E" stroke-width="1" stroke-linecap="round"><ellipse cx="12" cy="12" rx="6.2" ry="9" transform="rotate(-20 12 12)"></ellipse><path d="M14.3 4.2c-3.6 3.3-4.6 6.4-3 9 1.6 2.6 1 5.3-1.6 6.6"></path></svg>
    </span>
    <span style="flex:1;height:1px;background:#DCDCCA"></span>
  </div>

  <!-- ============ 2. ANTES DE IRTE: reseña + redes ============ -->
  <div style="padding:36px 28px 0;animation:prFade .3s ease-out .12s both">
    <h2 style="margin:0 0 14px;display:flex;align-items:center;gap:12px">
      <span data-t="revTitle" style="font-family:'Jost',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase;white-space:nowrap"></span>
      <span style="width:44px;height:1px;background:#DCDCCA"></span>
    </h2>
    <div style="padding:22px 20px 20px;background:#EFE3D6;border:1px solid #DCDCCA;border-radius:8px;display:flex;flex-direction:column;gap:10px">
      <p data-t="revHead" style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:23px;line-height:1.25;color:#5A3A2E;text-wrap:pretty"></p>
      <p data-t="revBody" style="margin:0;font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.4;color:#5A3A2E;text-wrap:pretty"></p>
      <!-- Google: enlace directo a "escribir reseña" -->
      <a href="https://search.google.com/local/writereview?placeid=ChIJx7gxb2OR05ERU7rI-qul3_s" target="_blank" rel="noopener noreferrer" class="pr-btn-card" style="display:flex;align-items:center;gap:14px;min-height:64px;margin-top:6px;padding:12px 18px;background:#FFFFFF;border:1px solid #DCDCCA;border-radius:8px;transition:transform .18s ease,border-color .18s ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"></path></svg>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
          <span data-t="revCta" style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase"></span>
          <span data-t="revCtaSub" style="font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.25;color:#5A3A2E"></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
      </a>
    </div>
  </div>

  <div style="padding:32px 28px 0;animation:prFade .3s ease-out .16s both">
    <h2 style="margin:0 0 14px;display:flex;align-items:center;gap:12px">
      <span data-t="social" style="font-family:'Jost',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase;white-space:nowrap"></span>
      <span style="width:44px;height:1px;background:#DCDCCA"></span>
    </h2>
    <!-- dos redes en una sola tarjeta: pesan menos que dos tarjetas sueltas -->
    <div style="background:#EFE3D6;border:1px solid #DCDCCA;border-radius:8px;overflow:hidden">
      <a href="https://instagram.com/pralinecoffeehouse" target="_blank" rel="noopener noreferrer" class="pr-btn-card" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;border:0;transition:transform .18s ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="16.9" cy="7.1" r=".9" fill="#565243" stroke="none"></circle></svg>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
          <span style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase">Instagram</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.25;color:#5A3A2E">@pralinecoffeehouse</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
      </a>
      <div aria-hidden="true" style="height:1px;margin:0 18px 0 54px;background:#DCDCCA"></div>
      <a href="https://www.facebook.com/pralinecoffeehouse/" target="_blank" rel="noopener noreferrer" class="pr-btn-card" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;border:0;transition:transform .18s ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="8.5"></circle><path d="M15 7.6h-1.4c-1.3 0-2 .8-2 2v10.9"></path><path d="M9.3 12.5h5"></path></svg>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
          <span style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase">Facebook</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.25;color:#5A3A2E">Praliné Coffee House</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
      </a>
    </div>
  </div>

  <!-- separador: fin de "antes de irte" -->
  <div aria-hidden="true" style="display:flex;align-items:center;padding:40px 28px 0">
    <span style="flex:1;height:1px;background:#DCDCCA"></span>
    <span style="display:flex;align-items:center;justify-content:center;width:26px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A3A2E" stroke-width="1" stroke-linecap="round"><ellipse cx="12" cy="12" rx="6.2" ry="9" transform="rotate(-20 12 12)"></ellipse><path d="M14.3 4.2c-3.6 3.3-4.6 6.4-3 9 1.6 2.6 1 5.3-1.6 6.6"></path></svg>
    </span>
    <span style="flex:1;height:1px;background:#DCDCCA"></span>
  </div>

  <!-- ============ 3. PARA VOLVER: horario + whatsapp + cómo llegar ============ -->
  <div style="padding:36px 28px 0;animation:prFade .3s ease-out .24s both">
    <h2 style="margin:0 0 8px;display:flex;align-items:center;gap:12px">
      <span data-t="hoursTitle" style="font-family:'Jost',sans-serif;font-weight:400;font-size:10.5px;letter-spacing:.2em;color:#5A3A2E;text-transform:uppercase;white-space:nowrap"></span>
      <span style="width:44px;height:1px;background:#DCDCCA"></span>
    </h2>
    <!-- siete filas generadas desde HOURS en script.js -->
    <ul id="hours" style="list-style:none;margin:0;padding:0"></ul>

    <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px">
      <a id="wa-link" href="https://wa.me/593999322363" target="_blank" rel="noopener noreferrer" class="pr-btn-card" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;background:#EFE3D6;border:1px solid #DCDCCA;border-radius:8px;transition:transform .18s ease,border-color .18s ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.2-4.3A8.5 8.5 0 1 1 20.5 12z"></path><path d="M9 9.4c0 3 2.6 5.6 5.6 5.6.6 0 1-.5 1-1.1 0-.3-.7-.9-1.2-1-.4-.1-.8.7-1.2.6-1-.4-1.9-1.3-2.3-2.3-.1-.4.7-.8.6-1.2-.1-.5-.7-1.2-1-1.2-.6 0-1.1.4-1.1 1z"></path></svg>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
          <span style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase">WhatsApp</span>
          <span data-t="waSub" style="font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.25;color:#5A3A2E"></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
      </a>

      <a href="https://www.google.com/maps/search/?api=1&amp;query=PRALIN%C3%89+Coffee+House&amp;query_place_id=ChIJx7gxb2OR05ERU7rI-qul3_s" target="_blank" rel="noopener noreferrer" class="pr-btn-card" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;background:#EFE3D6;border:1px solid #DCDCCA;border-radius:8px;transition:transform .18s ease,border-color .18s ease">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#565243" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 21s6.5-6.1 6.5-10.5A6.5 6.5 0 0 0 5.5 10.5C5.5 14.9 12 21 12 21z"></path><circle cx="12" cy="10.3" r="2.4"></circle></svg>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1">
          <span data-t="way" style="font-family:'Jost',sans-serif;font-weight:500;font-size:12px;letter-spacing:.18em;color:#565243;text-transform:uppercase"></span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.25;color:#5A3A2E">12 de Noviembre y Oriente<br><span data-t="addrNote" style="font-style:italic"></span></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 5.5 16 12l-7 6.5"></path></svg>
      </a>
    </div>
  </div>

  <!-- ============ PIE ============ -->
  <div style="margin-top:48px;background:#565243;padding:44px 28px 38px;position:relative;overflow:hidden;animation:prFade .3s ease-out .36s both">
    <div aria-hidden="true" style="position:absolute;inset:0;opacity:.15;background-image:url('assets/praline-botanical-sage.png');background-size:280px 280px;background-repeat:repeat"></div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-bottom:-2px">
        <img src="assets/mascota-lazo.png" alt="" aria-hidden="true" loading="lazy" style="width:60px;height:auto;display:block">
        <img src="assets/mascota-sombrero.png" alt="" aria-hidden="true" loading="lazy" style="width:60px;height:auto;display:block">
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A898" stroke-width="1" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="6.2" ry="9" transform="rotate(-20 12 12)"></ellipse><path d="M14.3 4.2c-3.6 3.3-4.6 6.4-3 9 1.6 2.6 1 5.3-1.6 6.6"></path></svg>
      <p style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:25px;line-height:1.35;letter-spacing:.01em;color:#FFFFFF;text-align:center;text-wrap:pretty"><span data-t="sloganA"></span><br><span data-t="sloganB"></span></p>
      <a href="https://instagram.com/pralinecoffeehouse" target="_blank" rel="noopener noreferrer" style="font-family:'Jost',sans-serif;font-weight:400;font-size:11.5px;letter-spacing:.22em;color:#DCDCCA;text-transform:uppercase;min-height:48px;display:flex;align-items:center">@pralinecoffeehouse</a>
      <span style="font-family:'Jost',sans-serif;font-weight:400;font-size:10px;letter-spacing:.2em;color:#DCDCCA;text-transform:uppercase">Baños de Agua Santa · Ecuador</span>
    </div>
  </div>

</div>
</div>

<!-- ============ VISOR DE MENÚ (hoja inferior) ============ -->
<div id="menu-sheet" hidden style="position:fixed;inset:0;z-index:20">
  <div id="menu-backdrop" style="position:absolute;inset:0;background:rgba(90,58,46,.45);opacity:0;transition:opacity .3s ease"></div>
  <div id="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menu-title" style="position:absolute;left:0;right:0;bottom:0;top:max(20px, env(safe-area-inset-top));max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1)">
    <div id="menu-head" style="position:relative;flex:none;border-bottom:1px solid #DCDCCA;background:#FFFFFF">
      <div aria-hidden="true" style="position:absolute;inset:0;opacity:.10;background-image:url('assets/praline-botanical-sage.png');background-size:240px 240px"></div>
      <div aria-hidden="true" style="position:relative;display:flex;justify-content:center;padding-top:8px"><span style="width:40px;height:4px;border-radius:2px;background:#DCDCCA"></span></div>
      <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:2px 10px 0 24px">
        <h2 id="menu-title" data-t="menuTitle" style="margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:28px;color:#5A3A2E"></h2>
        <button type="button" id="menu-close" style="width:48px;height:48px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <span style="width:38px;height:38px;border:1px solid #DCDCCA;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A3A2E" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </span>
        </button>
      </div>
      <nav id="menu-chips" style="position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 24px 10px;scrollbar-width:none;overscroll-behavior-x:contain"></nav>
    </div>
    <div id="menu-body" style="position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 24px calc(40px + env(safe-area-inset-bottom))"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
